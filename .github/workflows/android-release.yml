# .github/workflows/android-release.yml
name: Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Fetch legacy jcenter AARs into libs/
        run: |
          mkdir -p app/libs
          base="https://maven.aliyun.com/repository/jcenter"
          curl -fL -o app/libs/progressview-1.0.1.aar \
            "$base/com/white/progressview/1.0.1/progressview-1.0.1.aar"
          curl -fL -o app/libs/preference-v7-28.0.0.0.aar \
            "$base/com/takisoft/fix/preference-v7/28.0.0.0/preference-v7-28.0.0.0.aar"
          ls -l app/libs

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14