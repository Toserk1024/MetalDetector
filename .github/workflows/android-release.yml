- name: Fetch hellocharts AAR from jitpack (trigger build if needed)
  run: |
    mkdir -p app/libs
    AAR_URL="https://jitpack.io/com/github/lecho/hellocharts-android/v1.5.8/hellocharts-android-v1.5.8.aar"
    ok=0
    for i in $(seq 1 40); do
      echo "attempt $i ..."
      if curl -fL --retry 3 -o app/libs/hellocharts-android-v1.5.8.aar "$AAR_URL"; then
        ok=1; break
      fi
      # 触发/查询 jitpack 构建
      curl -s "https://jitpack.io/api/builds/com.github.lecho/hellocharts-android/v1.5.8" >/dev/null || true
      sleep 15
    done
    if [ "$ok" != "1" ]; then
      echo "::error::jitpack 构建 hellocharts v1.5.8 失败或超时"
      exit 1
    fi
    ls -l app/libs/hellocharts-android-v1.5.8.aar