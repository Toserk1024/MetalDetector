# .github/workflows/android-release.yml
name: Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键修改：Gradle 5.6.4 需要 JDK 8，不能用 17
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign unsigned APK with debug key (if needed)
        run: |
          UNSIGNED=$(find . -path "*/build/outputs/apk/release/*-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "没有未签名 APK，跳过补签"
            exit 0
          fi
          echo "找到未签名 APK: $UNSIGNED"
          DEBUG_KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$DEBUG_KS" ]; then
            keytool -genkeypair -v -keystore "$DEBUG_KS" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT="${UNSIGNED%-unsigned.apk}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$DEBUG_KS" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out "$OUT" "$UNSIGNED"
          echo "已签名输出: $OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14