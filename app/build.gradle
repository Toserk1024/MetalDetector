apply plugin: 'com.android.application'

android {
    namespace "com.yeliheng.metaldetector"   // AGP 8 必须
    compileSdk 34

    defaultConfig {
        applicationId "com.yeliheng.metaldetector"
        minSdk 21                            // AGP 8 支持 14，但 21 更稳
        targetSdk 29
        versionCode 6
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 关键：这里把 *.aar 也纳进来，两个 jcenter AAR 直接放 libs/
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.github.lecho:hellocharts-android:v1.5.8'
    implementation 'com.google.android.material:material:1.11.0'

    // 删掉这两行 —— 改用 libs/ 下的 AAR：
    //   implementation 'com.white:progressview:1.0.1'
    //   implementation 'com.takisoft.fix:preference-v7:28.0.0.0'
}